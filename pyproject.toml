[project]
name = "lex-portfolio-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jean Paul Cardozo", email = "paulcardozo_01@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt<4.1",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-jose[cryptography]>=3.5.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
lex-portfolio-api = "lex_portfolio_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
